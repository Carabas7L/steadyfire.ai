name: Build Science Friction downloads

on:
  push:
    branches:
      - science-friction-downloads-v3
    paths:
      - scripts/build_science_friction_downloads.py
      - .github/workflows/build-science-friction-downloads.yml

permissions:
  contents: write

jobs:
  build-downloads:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: science-friction-downloads-v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check beautifulsoup4 markdownify weasyprint

      - name: Build portable files
        run: python scripts/build_science_friction_downloads.py

      - name: Render and inspect PDF
        run: |
          mkdir -p qa
          PDF="science-friction/downloads/La_Romance_de_U-Sola_et_Igor_V3.pdf"
          pdfinfo "$PDF" | tee qa/pdfinfo.txt
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test -n "$PAGES"
          test "$PAGES" -gt 10
          pdftoppm -f 1 -l 1 -r 140 -png -singlefile "$PDF" qa/first-page
          pdftoppm -f "$PAGES" -l "$PAGES" -r 140 -png -singlefile "$PDF" qa/last-page
          cp science-friction/downloads/SHA256SUMS.txt qa/SHA256SUMS.txt

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: science-friction-downloads-qa
          path: |
            science-friction/downloads
            qa
          if-no-files-found: error

      - name: Commit generated downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-friction/downloads
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build portable Science Friction downloads"
          git push origin HEAD:science-friction-downloads-v3
